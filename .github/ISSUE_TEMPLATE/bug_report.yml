name: "Bug report (Magic Card Utils integration)"
description: "Something in the Magic Card Utils Home Assistant integration or its panels does not work as expected."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Fill in every part of this form. A report without the Home Assistant log is hard to act on.

        Do not report security problems here. Report them privately at https://github.com/therealmcsparrow/magic-card-utils/security/advisories/new

  - type: checkboxes
    id: checklist
    attributes:
      label: "Before you submit"
      description: "Tick every box. The form is for problems you can reproduce on the latest release."
      options:
        - label: "I searched the existing issues and found no report of this problem."
          required: true
        - label: "I am on the latest Magic Card Utils release."
          required: true
        - label: "I restarted Home Assistant after I updated Magic Card Utils."
          required: true
        - label: "I checked the Home Assistant log for errors about Magic Card Utils."
          required: true
        - label: "This is not a security issue. Security problems go through private reporting, not this form."
          required: true

  - type: input
    id: utils_version
    attributes:
      label: "Magic Card Utils version"
      description: "Shown in HACS, or in Settings → Devices & services → Magic Card Utils."
      placeholder: "for example 2026.10.09"
    validations:
      required: true

  - type: input
    id: card_version
    attributes:
      label: "Magic Card version"
      description: "Only if the problem involves the card. Shown in HACS."
      placeholder: "for example 2026.10.10"

  - type: input
    id: ha_version
    attributes:
      label: "Home Assistant version"
      description: "Settings → About."
      placeholder: "for example 2026.10.1"
    validations:
      required: true

  - type: dropdown
    id: install_type
    attributes:
      label: "Home Assistant installation type"
      options:
        - "Home Assistant OS"
        - "Home Assistant Container"
        - "Home Assistant Supervised"
        - "Home Assistant Core"
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: "How did you install Magic Card Utils?"
      options:
        - "HACS"
        - "Manual (I copied the files myself)"
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: "What happened?"
      description: "Describe the problem and what you see. Name the Magic Card Utils tab or feature if it applies."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      description: "Numbered steps from a clean start to the problem."
      placeholder: |
        1. Open the Magic Card Utils panel.
        2. Select ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Home Assistant log with debug logging"
      description: |
        Turn on debug logging for the integration, restart Home Assistant, reproduce the problem, then copy the Magic Card Utils lines from Settings → System → Logs. Add this to configuration.yaml:

        ```yaml
        logger:
          default: warning
          logs:
            custom_components.magic_card_utils: debug
        ```

        Remove the lines again when you are done, because debug logging is verbose.
      render: shell
    validations:
      required: true

  - type: input
    id: browser_device
    attributes:
      label: "Browser and device (if the problem is in the panel)"
      description: "For example Chrome 130 on Windows 11, or the Home Assistant companion app on Android 15. Leave empty if the problem is not in the panel."
      placeholder: "for example Firefox 140 on macOS 15"

  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots or screen recording"
      description: "Drag files into this box."
