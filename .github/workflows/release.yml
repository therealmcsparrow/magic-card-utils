name: Release

# Runs when a calendar-version tag is pushed. It builds the integration zip and
# the SBOM, attests both, then creates the release for the existing tag.
# It never creates or moves tags.
on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest and release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload assets
      id-token: write # sign attestations
      attestations: write # store attestations
    env:
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
      LIT_VERSION: "3.3.3"
      MDI_VERSION: "7.4.47"
      FONTSOURCE_VERSION: "5.3.0"
    steps:
      - name: Check tag format
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.([0-9]{2}|[1-9][0-9]?-beta\.[0-9]+)$'; then
            echo "::error::Tag is not a calendar version (YYYY.MM.DD, or YYYY.MM.D-beta.N with no leading zero in the last part, as Home Assistant needs for a beta)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag matches manifest version
        run: |
          set -euo pipefail
          version=$(python3 -c "import json;print(json.load(open('custom_components/magic_card_utils/manifest.json'))['version'])")
          if [ "$version" != "$TAG" ]; then
            echo "::error::Release tag '$TAG' does not match manifest version '$version'"
            exit 1
          fi

      - name: Build integration zip
        run: |
          set -euo pipefail
          # HACS (zip_release) expects the integration files at the zip root.
          (cd custom_components/magic_card_utils && zip -r -X "$GITHUB_WORKSPACE/magic_card_utils.zip" . -x '*__pycache__*' '*.pyc')
          unzip -l magic_card_utils.zip

      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, glob, hashlib, uuid, datetime
          tag = os.environ["TAG"]
          lit = os.environ["LIT_VERSION"]
          www = "custom_components/magic_card_utils/www"
          lit_files = sorted(glob.glob(f"{www}/*lit*.js"))
          if not lit_files:
              print(f"::warning::no vendored Lit file matching {www}/*lit*.js found; SBOM lists Lit {lit} anyway")
          lit_comp = {
              "type": "library",
              "bom-ref": f"pkg:npm/lit@{lit}",
              "name": "lit",
              "version": lit,
              "purl": f"pkg:npm/lit@{lit}",
              "licenses": [{"license": {"id": "BSD-3-Clause"}}],
              "externalReferences": [{"type": "website", "url": "https://lit.dev"}],
              "properties": [{"name": "vendored-in", "value": ", ".join(lit_files) or "unknown"}],
          }
          if lit_files:
              lit_comp["hashes"] = [{"alg": "SHA-256", "content": hashlib.sha256(open(lit_files[0], "rb").read()).hexdigest()}]
          mdi = os.environ["MDI_VERSION"]
          kit = f"{www}/mc-ui-kit.js"
          mdi_comp = {
              "type": "library",
              "bom-ref": f"pkg:npm/%40mdi/js@{mdi}",
              "name": "@mdi/js",
              "version": mdi,
              "purl": f"pkg:npm/%40mdi/js@{mdi}",
              "licenses": [{"license": {"id": "Apache-2.0"}}],
              "externalReferences": [{"type": "website", "url": "https://pictogrammers.com/library/mdi/"}],
              "properties": [{"name": "vendored-in", "value": kit}, {"name": "licence-text", "value": f"{www}/LICENSE-mdi.txt"}],
          }
          if os.path.exists(kit):
              mdi_comp["hashes"] = [{"alg": "SHA-256", "content": hashlib.sha256(open(kit, "rb").read()).hexdigest()}]
          else:
              print(f"::warning::{kit} not found; SBOM lists @mdi/js {mdi} anyway")
          fontsource = os.environ["FONTSOURCE_VERSION"]
          font_comps = []
          for package, file, website in [
              ("space-grotesk", "space-grotesk-latin-wght-normal.woff2", "https://github.com/floriankarsten/space-grotesk"),
              ("jetbrains-mono", "jetbrains-mono-latin-wght-normal.woff2", "https://github.com/JetBrains/JetBrainsMono"),
          ]:
              font_file = f"{www}/fonts/{file}"
              ref = f"pkg:npm/%40fontsource-variable/{package}@{fontsource}"
              font_comp = {
                  "type": "data",
                  "bom-ref": ref,
                  "name": f"@fontsource-variable/{package}",
                  "version": fontsource,
                  "purl": ref,
                  "licenses": [{"license": {"id": "OFL-1.1"}}],
                  "externalReferences": [{"type": "website", "url": website}],
                  "properties": [{"name": "vendored-in", "value": font_file}, {"name": "licence-text", "value": f"{www}/fonts/OFL.txt"}],
              }
              if os.path.exists(font_file):
                  font_comp["hashes"] = [{"alg": "SHA-256", "content": hashlib.sha256(open(font_file, "rb").read()).hexdigest()}]
              else:
                  print(f"::warning::{font_file} not found; SBOM lists {package} anyway")
              font_comps.append(font_comp)
          # The theme editor and forum shot files are built by the Magic Card export tool.
          # Each file is hashed from the shipped bytes; a hash that differs from magic-card-tools.json fails the job.
          tools_path = f"{www}/magic-card-tools.json"
          tools = json.load(open(tools_path, encoding="utf-8"))
          tool_comps = []
          owned = re.compile(r"^magic-card-[a-z0-9-]+(\.[0-9a-f]{8})?\.js$")
          for name, recorded in sorted(tools["files"].items()):
              if not owned.match(name):
                  print(f"::error::{tools_path} lists {name}, which is not a magic-card-*.js file name")
                  raise SystemExit(1)
              path = f"{www}/{name}"
              digest = hashlib.sha256(open(path, "rb").read()).hexdigest()
              if digest != recorded:
                  print(f"::error::{path} does not match its hash in {tools_path}")
                  raise SystemExit(1)
              tool_comps.append({
                  "type": "file",
                  "bom-ref": f"file:{path}",
                  "purl": f"pkg:github/{os.environ['GH_REPO']}@{tag}#{path}",
                  "name": name,
                  "version": tag,
                  "hashes": [{"alg": "SHA-256", "content": digest}],
                  "properties": [{"name": "vendored-in", "value": path}],
              })
          # Licence of each bundled package, with the licence text in this repository.
          licences = {
              "lit": ("BSD-3-Clause", f"{www}/LICENSE-lit.txt"),
              "lit-html": ("BSD-3-Clause", f"{www}/LICENSE-lit.txt"),
              "lit-element": ("BSD-3-Clause", f"{www}/LICENSE-lit.txt"),
              "@lit/reactive-element": ("BSD-3-Clause", f"{www}/LICENSE-lit.txt"),
              "@lit-labs/ssr-dom-shim": ("BSD-3-Clause", f"{www}/LICENSE-lit.txt"),
              "@mdi/js": ("Apache-2.0", f"{www}/LICENSE-mdi.txt"),
              "@types/trusted-types": ("MIT", f"{www}/LICENSE-trusted-types.txt"),
          }
          vendored = {c["purl"]: c for c in [lit_comp, mdi_comp]}
          bundled_comps = []
          for package, version in sorted(tools["bundled"]["packages"].items()):
              purl = "pkg:npm/" + package.replace("@", "%40", 1) + "@" + version
              if purl in vendored:
                  vendored[purl]["properties"].append({"name": "vendored-in", "value": tools_path})
                  continue
              if package not in licences:
                  print(f"::error::bundled package {package} has no licence text mapped in release.yml; add its licence text to {www} and map it")
                  raise SystemExit(1)
              spdx, text = licences[package]
              if not os.path.isfile(text):
                  print(f"::error::licence text {text} for {package} is missing")
                  raise SystemExit(1)
              bundled_comps.append({
                  "type": "library",
                  "bom-ref": purl,
                  "name": package,
                  "version": version,
                  "purl": purl,
                  "licenses": [{"license": {"id": spdx}}],
                  "properties": [{"name": "vendored-in", "value": tools_path}, {"name": "licence-text", "value": text}],
              })
          # Fonts bundled inside the studio-fonts chunk (recorded in magic-card-tools.json), all under the SIL OFL.
          ofl_text = f"{www}/fonts/OFL.txt"
          bundled_fonts = tools["bundled"].get("fonts", [])
          if bundled_fonts and not os.path.isfile(ofl_text):
              print(f"::error::licence text {ofl_text} for the bundled fonts is missing")
              raise SystemExit(1)
          for family in bundled_fonts:
              slug = re.sub(r"[^a-z0-9]+", "-", family.lower()).strip("-")
              ref = f"pkg:generic/font-{slug}"
              if any(c["bom-ref"] == ref for c in font_comps):
                  continue
              font_comps.append({
                  "type": "data",
                  "bom-ref": ref,
                  "name": family,
                  "purl": ref,
                  "licenses": [{"license": {"id": "OFL-1.1"}}],
                  "properties": [{"name": "vendored-in", "value": tools_path}, {"name": "licence-text", "value": ofl_text}],
              })
          app = {
              "type": "application",
              "bom-ref": f"pkg:github/{os.environ['GH_REPO']}@{tag}",
              "name": "magic_card_utils",
              "version": tag,
              "purl": f"pkg:github/{os.environ['GH_REPO']}@{tag}",
              "licenses": [{"license": {"id": "MIT"}}],
          }
          bom = {
              "bomFormat": "CycloneDX",
              "specVersion": "1.6",
              "serialNumber": f"urn:uuid:{uuid.uuid4()}",
              "version": 1,
              "metadata": {
                  "timestamp": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "component": app,
                  "tools": {"components": [{"type": "application", "name": "release.yml inline generator"}]},
              },
              "components": [lit_comp, mdi_comp] + font_comps + bundled_comps + tool_comps,
              "dependencies": [
                  {"ref": app["bom-ref"], "dependsOn": [lit_comp["bom-ref"], mdi_comp["bom-ref"]] + [c["bom-ref"] for c in font_comps + bundled_comps + tool_comps]},
                  {"ref": lit_comp["bom-ref"], "dependsOn": []},
                  {"ref": mdi_comp["bom-ref"], "dependsOn": []},
              ]
              + [{"ref": c["bom-ref"], "dependsOn": []} for c in font_comps + bundled_comps + tool_comps],
          }
          json.dump(bom, open("magic_card_utils.sbom.cdx.json", "w"), indent=2)
          PY
          python3 -m json.tool magic_card_utils.sbom.cdx.json > /dev/null

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            magic_card_utils.zip
            magic_card_utils.sbom.cdx.json

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: magic_card_utils.zip
          sbom-path: magic_card_utils.sbom.cdx.json

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          case "$TAG" in
            *-*) flags+=(--prerelease --latest=false) ;;
          esac
          gh release create "$TAG" magic_card_utils.zip magic_card_utils.sbom.cdx.json --verify-tag --title "$TAG" --generate-notes "${flags[@]}"
